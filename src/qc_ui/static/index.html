<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QDE</title>
<style>
:root{
  --bg:#FBFBFC; --card:#FFF; --line:#E4E6EB; --ink:#15181C; --dim:#6C737F;
  --up:#C0341F; --down:#2B55C4; --ok:#1F7A4D; --warn:#9A6608;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0E1114; --card:#171B20; --line:#252A31; --ink:#E8EBEF; --dim:#8D95A1;
  --up:#F2634A; --down:#7C9BF0; --ok:#4FBF87; --warn:#D6A83C;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15}
:focus-visible{outline:2px solid var(--down);outline-offset:3px}

.wrap{max-width:1080px;margin:0 auto;padding:0 24px 80px}
header{padding:38px 0 26px}
.logo{font-size:30px;font-weight:700;letter-spacing:-.03em}
.logo span{color:var(--up)}
.tag{color:var(--dim);margin-top:6px;font-size:15px}
.meta{margin-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.meta a{color:var(--dim)}

h2.step{font-size:13px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin:34px 0 14px;font-weight:600}
h2.step:first-of-type{margin-top:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.samp{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:16px;
  cursor:pointer;text-align:left;width:100%;transition:border-color .15s,transform .15s}
.samp:hover{border-color:var(--up);transform:translateY(-2px)}
.samp .nm{font-weight:650;font-size:16px}
.samp .nt{color:var(--dim);font-size:13px;margin-top:2px}
.bars{margin-top:13px;display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:60px 1fr 46px;gap:8px;align-items:center;
  font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.bar .tr{height:7px;background:var(--bg);border-radius:4px;position:relative;overflow:hidden}
.bar .tr i{position:absolute;top:0;bottom:0;left:50%;border-radius:4px}
.bar .v{text-align:right}

.btn{padding:10px 18px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  cursor:pointer;font-weight:600}
.btn.primary{background:var(--up);border-color:var(--up);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.steps{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin:6px 0 22px}
.st{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:10px 0 10px 18px;position:relative;
  opacity:0;transform:translateX(-8px);transition:opacity .3s,transform .3s}
.st.in{opacity:1;transform:none}
.st::before{content:"";position:absolute;left:-6px;top:16px;width:10px;height:10px;
  border-radius:50%;background:var(--up);border:2px solid var(--bg)}
.st .n{font-family:var(--mono);font-size:11px;color:var(--up);font-weight:600;padding-top:3px}
.st .t{font-weight:600}
.st .d{color:var(--dim);font-size:13.5px;margin-top:1px}

.answer{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.answer .top{display:grid;grid-template-columns:minmax(280px,1fr) 1fr;gap:0}
@media(max-width:760px){.answer .top{grid-template-columns:1fr}}
.molbox{background:var(--bg);border-right:1px solid var(--line);padding:14px;color:var(--ink)}
.molbox svg{display:block;width:100%;height:auto}
.side{padding:22px 24px}
.side h3{font-size:22px;letter-spacing:-.02em}
.side .for{color:var(--dim);font-size:13.5px;margin-top:4px}
.big{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;margin:16px 0 2px}
.biglab{color:var(--dim);font-size:12.5px}

.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
  background:var(--line);border-top:1px solid var(--line)}
.sc{background:var(--card);padding:13px 15px}
.sc .l{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.sc .v{font-family:var(--mono);font-size:19px;font-weight:600;margin:4px 0 6px;line-height:1}
.sc .t{height:4px;border-radius:2px;background:var(--bg);overflow:hidden}
.sc .t i{display:block;height:100%;width:0;transition:width .8s cubic-bezier(.22,1,.36,1)}
.hi .v{color:var(--ok)} .hi i{background:var(--ok)}
.md .v{color:var(--warn)} .md i{background:var(--warn)}
.lo .v{color:var(--up)} .lo i{background:var(--up)}

.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.part{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:13px 15px;cursor:pointer;
  transition:border-color .15s}
.part:hover{border-color:var(--down)}
.part .pn{font-weight:650;font-size:14px;color:var(--down)}
.part .pw{color:var(--dim);font-size:12.5px;margin-top:4px;line-height:1.5}

.warn{border:1px solid var(--up);border-radius:10px;padding:15px 17px;margin-top:22px;
  background:color-mix(in srgb,var(--up) 7%,transparent);font-size:13.5px;line-height:1.6}
.warn b{color:var(--up)}
.warn p{margin:0 0 10px} .warn p:last-child{margin:0}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.s{font-family:var(--mono);font-weight:600;color:var(--down)}
.tw{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;margin-top:6px}

.log{font-family:var(--mono);font-size:11.5px;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--down);border-radius:8px;padding:12px 14px;max-height:200px;overflow-y:auto;
  white-space:pre-wrap;color:var(--dim)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--up);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.note{color:var(--dim);text-align:center;padding:30px}
.err{color:var(--up);border:1px solid var(--up);border-radius:9px;padding:14px;font-family:var(--mono);font-size:12.5px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;font-family:var(--mono)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.no{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.st{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo">QD<span>E</span></div>
  <div class="tag">Give it a blood sample. It works out what the sample points at, finds the best-matched compound, and shows you what that compound is made of.</div>
  <div class="meta" id="meta"></div>
</header>

<div id="view"></div>

</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=(v,d=2)=>(v===null||v===undefined||Number.isNaN(+v))?'—':(+v).toFixed(d);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function api(p,o){
  const r=await fetch(p,o); const j=await r.json().catch(()=>({error:'bad JSON'}));
  if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status)); return j;
}
async function runJob(path,body,logEl){
  const job=await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return new Promise((res,rej)=>{
    const tick=async()=>{
      try{
        const j=await api('/api/job?id='+job.id);
        if(logEl){logEl.textContent=(j.progress||[]).join('\n')||'working…';logEl.scrollTop=logEl.scrollHeight;}
        if(j.status==='running') return setTimeout(tick,800);
        if(j.status==='error') return rej(new Error(j.error));
        res(j.result);
      }catch(e){rej(e);}
    };
    setTimeout(tick,400);
  });
}
async function molSvg(smiles,w,h,animate,highlight){
  const q=`/api/depict?smiles=${encodeURIComponent(smiles)}&w=${w}&h=${h}`
    +(animate?'&animate=1':'')+(highlight?`&highlight=${encodeURIComponent(highlight)}`:'');
  try{ const j=await api(q); return j.svg||''; }catch(e){ return `<div class="note">${esc(e.message)}</div>`; }
}

let PRESETS=[];

async function showSamples(){
  $('#view').innerHTML='<h2 class="step">Choose a sample</h2><div class="note"><span class="spin"></span> loading samples…</div>';
  try{
    const [j,s]=await Promise.all([api('/api/presets'),api('/api/stats')]);
    PRESETS=j.presets;
    const c=s.counts;
    $('#meta').innerHTML=`${c.target} proteins · ${c.compound} compounds · ${c.activity} measurements · `
      +`<a href="/full">full research tools →</a>`;

    const grid=PRESETS.map((p,i)=>{
      const bars=p.highlights.slice(0,6).map(h=>{
        const w=Math.min(48,Math.abs(h.log2)/3*48);
        const up=h.log2>0;
        return `<div class="bar"><span>${esc(h.symbol)}</span>
          <span class="tr"><i style="${up?'left:50%':'right:50%'};width:${w}%;background:var(--${up?'up':'down'})"></i></span>
          <span class="v">${h.fold}x</span></div>`;
      }).join('');
      return `<button class="samp" data-i="${i}">
        <div class="nm">${esc(p.label)}</div><div class="nt">${esc(p.note)}</div>
        <div class="bars">${bars}</div></button>`;
    }).join('');
    $('#view').innerHTML=`<h2 class="step">Choose a sample</h2><div class="grid">${grid}</div>`;
    document.querySelectorAll('.samp').forEach(b=>b.onclick=()=>analyse(PRESETS[+b.dataset.i]));
  }catch(e){ $('#view').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

async function analyse(preset){
  const text=Object.entries(preset.panel).map(([k,v])=>`${k} ${v}`).join('\n');
  $('#view').innerHTML=`<div class="row" style="margin-bottom:18px">
      <button class="btn" id="back">← samples</button>
      <div><b>${esc(preset.label)}</b> <span style="color:var(--dim)">· ${preset.n_proteins} proteins measured</span></div>
    </div>
    <h2 class="step">Analysing</h2><pre class="log" id="log">starting…</pre>`;
  $('#back').onclick=showSamples;
  try{
    const res=await runJob('/api/run_sample',{panel:text},$('#log'));
    await render(res,preset);
  }catch(e){
    document.querySelector('#log').insertAdjacentHTML('afterend',`<div class="err" style="margin-top:14px">${esc(e.message)}</div>`);
  }
}

async function render(res,preset){
  const v=$('#view');
  v.innerHTML=`<div class="row" style="margin-bottom:18px">
      <button class="btn" id="back">← samples</button>
      <div><b>${esc(preset.label)}</b> <span style="color:var(--dim)">· ${preset.n_proteins} proteins measured</span></div>
    </div>`;
  $('#back').onclick=showSamples;

  const top=(res.matches||[])[0]||{};
  const clear=top.clear!==false;

  v.insertAdjacentHTML('beforeend','<h2 class="step">What it did</h2><div class="steps" id="steps"></div>');
  const nodes=res.stages.map((s,i)=>{
    const n=document.createElement('div'); n.className='st';
    n.innerHTML=`<div class="n">${String(i+1).padStart(2,'0')}</div>
      <div><div class="t">${esc(s.title)}</div><div class="d">${esc(s.detail)}</div></div>`;
    $('#steps').appendChild(n); return n;
  });
  nodes.forEach((n,i)=>setTimeout(()=>n.classList.add('in'),50+i*130));
  await sleep(res.stages.length*130+200);
  nodes.forEach(n=>n.classList.add('in'));

  v.insertAdjacentHTML('beforeend',`<h2 class="step">What the sample points at</h2>
    <div class="tw"><table><thead><tr><th>disease</th><th>confidence</th><th>signal strength</th><th>call</th></tr></thead>
    <tbody>${res.matches.map((m,i)=>`<tr>
      <td class="${i===0?'s':''}">${esc(m.name)}</td>
      <td class="n">${m.confidence}%</td>
      <td class="n">${num(m.enrichment,2)}x background</td>
      <td>${m.clear?'<span class="pill ok">clear</span>':'<span class="pill no">too weak to call</span>'}</td>
    </tr>`).join('')}</tbody></table></div>`);

  if(!clear){
    v.insertAdjacentHTML('beforeend',`<div class="warn"><p><b>No clear disease signal in this sample.</b>
      The strongest match is only ${num(top.enrichment,2)}x above the panel's own noise level, which is what an
      unremarkable sample looks like. Everything below is what the pipeline would do anyway — treat it as a
      demonstration of the mechanics, not a finding.</p></div>`);
  }

  const best=res.best, bs=res.build_sheet||{};
  if(!best){ return; }

  v.insertAdjacentHTML('beforeend',`<h2 class="step">Best matched compound</h2>
    <div class="answer">
      <div class="top">
        <div class="molbox" id="mol"><div class="note"><span class="spin"></span></div></div>
        <div class="side">
          <h3>${esc(best.pref_name||best.chembl_id)}</h3>
          <div class="for">binds <b>${esc(res.target.symbol)}</b>${res.target.name?` — ${esc(res.target.name)}`:''}</div>
          <div class="big" id="ov">0<span style="font-size:22px">%</span></div>
          <div class="biglab">overall, weighted across the six measures below</div>
          <div class="for" style="margin-top:14px">
            ${best.best_pchembl?`Measured potency <b>${(Math.pow(10,-best.best_pchembl)*1e9).toFixed(1)} nM</b>. `:''}
            ${best.max_phase>=4?'An approved drug.':best.max_phase>0?`Reached phase ${best.max_phase}.`:'Never entered clinical trials.'}
          </div>
        </div>
      </div>
      <div class="scores" id="scores"></div>
    </div>`);

  molSvg(best.smiles,560,380,true).then(svg=>{ $('#mol').innerHTML=svg; });

  const G=[['potency','Potency'],['druglikeness','Druglikeness'],['target_evidence','Evidence'],
           ['safety','Safety'],['selectivity','Selectivity'],['clinical_precedent','Precedent']];
  $('#scores').innerHTML=G.map(([k,l])=>{
    const val=best.scores[k]??0, cls=val>=66?'hi':val>=33?'md':'lo';
    return `<div class="sc ${cls}"><div class="l">${esc(l)}</div><div class="v">${val}%</div>
      <div class="t"><i data-w="${val}"></i></div></div>`;
  }).join('');
  setTimeout(()=>document.querySelectorAll('#scores .t i').forEach(i=>i.style.width=i.dataset.w+'%'),60);
  countUp($('#ov'),best.scores.overall);

  if(bs.parts&&bs.parts.length){
    v.insertAdjacentHTML('beforeend',`<h2 class="step">What it is made of</h2>
      <div style="color:var(--dim);font-size:13.5px;margin-bottom:4px">
        ${bs.scaffold_size} of ${bs.n_atoms} atoms form the rigid scaffold; ${bs.side_chain_atoms} hang off it.
        ${(bs.lipinski||{}).verdict?esc(bs.lipinski.verdict[0].toUpperCase()+bs.lipinski.verdict.slice(1))+'.':''}
        Click a part to highlight it on the structure.</div>
      <div class="parts" id="parts">${bs.parts.map(p=>
        `<div class="part" data-atoms="${esc((p.atoms||[]).join(','))}">
           <div class="pn">${esc(p.name)}</div><div class="pw">${esc(p.role)}</div></div>`).join('')}</div>`);
    document.querySelectorAll('#parts .part').forEach(card=>{
      card.onclick=async()=>{
        document.querySelectorAll('#parts .part').forEach(c=>c.style.borderColor='');
        card.style.borderColor='var(--up)';
        $('#mol').innerHTML='<div class="note"><span class="spin"></span></div>';
        $('#mol').innerHTML=await molSvg(best.smiles,560,380,false,card.dataset.atoms);
      };
    });
  }

  if((res.caveats||[]).length){
    v.insertAdjacentHTML('beforeend',
      `<div class="warn"><p><b>Before you use any of this</b></p>${res.caveats.map(c=>`<p>${esc(c)}</p>`).join('')}</div>`);
  }
}

function countUp(node,target){
  const t=+target||0; let cur=0,done=false;
  const step=()=>{ if(done)return; cur+=Math.max(1,t/26);
    if(cur>=t){done=true;node.innerHTML=t+'<span style="font-size:22px">%</span>';return;}
    node.innerHTML=Math.round(cur)+'<span style="font-size:22px">%</span>'; requestAnimationFrame(step); };
  step();
  setTimeout(()=>{done=true;node.innerHTML=t+'<span style="font-size:22px">%</span>';},1400);
}

showSamples();
</script>
</body>
</html>
