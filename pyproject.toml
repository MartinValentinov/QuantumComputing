[project]
name = "qc"
version = "0.1.0"
description = "Automated biomedical research graph + quantum chemistry benchmarking"
requires-python = ">=3.11"
dependencies = []          # qc_research is stdlib-only by design

[project.optional-dependencies]
quantum = [
    "qiskit>=2.0",
    "qiskit-nature>=0.7",
    "qiskit-algorithms>=0.3",
    "pyscf>=2.5",
    "ase>=3.22",
    "py3Dmol>=2.0",
    "matplotlib>=3.8",
]
design = [
    # The installed SDK (0.46.0) predates `beta.messages.tool_runner` and the
    # adaptive-thinking parameter; the agent degrades gracefully but wants a
    # current one.
    "anthropic>=0.70",
]
design-chem = [
    "rdkit>=2024.3",
    "botorch>=0.11",
    "ax-platform>=0.4",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
qc-research = "qc_research.cli:main"
qc-bench = "qc_quantum.benchmark:main"
qc-design = "qc_design.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 90
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
